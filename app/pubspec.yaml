name: saathi
description: "Saathi, a lab test booking companion with offline-first chat"
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.14.0

dependencies:
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  fetch_client: ^1.2.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_chat_core: ^2.9.1
  flutter_chat_ui: ^2.12.0
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  http: ^1.6.0
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.11.1
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  go_router_builder: ^4.5.3
  injectable_generator: ^3.1.3
  slang_build_runner: ^4.19.0
  flutter_gen_runner: ^5.15.0
  icons_launcher: ^3.1.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  provider: ^6.1.5+1

flutter:
  uses-material-design: true
  assets:
    - assets/shared/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf

flutter_gen:
  output: lib/gen/
  integrations: {}
