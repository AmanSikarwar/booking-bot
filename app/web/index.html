  <style>
    html, body { margin: 0; height: 100%; background: #F2F6F6; }
    #splash {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
      background: #F2F6F6;
      transition: opacity 320ms ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; animation: splash-in 480ms cubic-bezier(.2, .8, .2, 1) both; }
    #splash .bar {
      position: relative; overflow: hidden; width: 112px; height: 3px; border-radius: 3px;
      background: #D5E3E1; opacity: 0; animation: splash-show 200ms 400ms ease-out forwards;
    }
    #splash .bar::after {
      content: ""; position: absolute; inset: 0; width: 40%; border-radius: inherit;
      background: #0F766E; animation: splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-in { from { opacity: 0; transform: scale(.92); } }
    @keyframes splash-show { to { opacity: 1; } }
    @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash { transition-duration: 1ms; }
      #splash img { animation: none; }
      #splash .bar::after { animation: none; width: 100%; opacity: .5; }
    }
  </style>
