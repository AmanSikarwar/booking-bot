name: Publish web demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        id: pages
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          cache: true
      - name: Build web release
        working-directory: app
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --no-pub --base-href="${PAGES_BASE_PATH%/}/" --no-web-resources-cdn
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
